<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Chatbot</title>
<style>
  :root {
    --bg: #0c0f1e; --panel: #151931; --panel-2: #1b2040; --border: #2b3158;
    --text: #eef0fb; --muted: #a8a6c8; --accent: #b18cff; --accent-ink: #1a1030;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }
  html { scrollbar-color: var(--border) transparent; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    caret-color: var(--accent);
  }
  header {
    width: 100%; max-width: 860px; padding: 40px 20px 6px;
  }
  h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; }
  h1 em { font-style: normal; color: var(--accent); }
  .sub { color: var(--muted); font-size: 15px; margin-top: 6px; max-width: 52ch; line-height: 1.5; }
  main { width: 100%; max-width: 860px; padding: 20px 20px 130px; flex: 1; }
  .upload {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    background: var(--panel); border: 1px dashed var(--border);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 18px;
    transition: border-color .2s ease;
  }
  .upload:hover { border-color: var(--accent); }
  .upload input[type=file] { color: var(--muted); font-size: 13px; max-width: 100%; }
  .upload input[type=file]::file-selector-button {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 7px; padding: 7px 14px; margin-right: 10px; cursor: pointer; font-size: 13px;
  }
  button {
    background: var(--accent); color: var(--accent-ink); font-weight: 700; border: 0;
    border-radius: 9px; padding: 10px 20px; font-size: 14px; cursor: pointer;
    transition: transform .12s ease, filter .12s ease;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: .45; cursor: wait; transform: none; }
  .status { color: var(--muted); font-size: 13px; }
  .empty {
    text-align: center; color: var(--muted); padding: 60px 20px; line-height: 1.7; font-size: 15px;
  }
  .empty b { color: var(--text); display: block; font-size: 17px; margin-bottom: 4px; }
  .msg {
    padding: 13px 16px; border-radius: 14px; margin: 12px 0;
    line-height: 1.55; white-space: pre-wrap; max-width: 85%;
    animation: rise .25s cubic-bezier(.2,.9,.3,1) both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } }
  @media (prefers-reduced-motion: reduce) { .msg { animation: none; } }
  .q { background: var(--panel-2); border: 1px solid var(--border); margin-left: auto; border-bottom-right-radius: 4px; }
  .a { background: var(--panel); border: 1px solid var(--border); margin-right: auto; border-bottom-left-radius: 4px; }
  .a.busy { color: var(--muted); }
  .srcs { margin-top: 12px; font-size: 13px; color: var(--muted); }
  .srcs summary { cursor: pointer; color: var(--accent); font-weight: 600; }
  .srcs summary:hover { text-decoration: underline; text-underline-offset: 3px; }
  .src { border-top: 1px solid var(--border); padding: 8px 2px; margin-top: 8px; }
  .src b { color: var(--text); }
  .src .score { float: right; font-variant-numeric: tabular-nums; }
  form.ask {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 860px; padding: 14px 20px 24px;
    background: linear-gradient(transparent, var(--bg) 30%);
    display: flex; gap: 10px;
  }
  form.ask input {
    flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--border);
    border-radius: 11px; padding: 13px 16px; color: var(--text); font-size: 15px;
    transition: border-color .15s ease;
  }
  form.ask input::placeholder { color: var(--muted); }
  form.ask input:hover { border-color: var(--accent); }
  form.ask input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgb(177 140 255 / .25); }
</style>
</head>
<body>
<header>
  <h1>Ask your <em>documents</em></h1>
  <p class="sub">Upload a PDF or text file, then ask questions. Every answer cites the exact passages it came from &mdash; and says "I don't know" when they don't cover it.</p>
</header>
<main>
  <div class="upload">
    <input type="file" id="file" accept=".pdf,.txt,.md" aria-label="Document to ingest">
    <button id="ingest">Ingest</button>
    <span class="status" id="upstatus">No documents ingested yet.</span>
  </div>
  <div id="chat">
    <div class="empty" id="emptystate"><b>Nothing here yet</b>Ingest a document above, then ask your first question below.</div>
  </div>
</main>
<form class="ask" id="askform">
  <input id="question" placeholder="Ask about the uploaded documents&hellip;" autocomplete="off" aria-label="Your question">
  <button id="askbtn">Ask</button>
</form>
<script>
const $ = id => document.getElementById(id);
const SID = localStorage.sid || (localStorage.sid = crypto.randomUUID());
const HDRS = { 'X-Session-Id': SID };

$('ingest').onclick = async () => {
  const f = $('file').files[0];
  if (!f) { $('upstatus').textContent = 'Choose a file first.'; return; }
  $('ingest').disabled = true;
  $('upstatus').textContent = 'Ingesting…';
  const fd = new FormData();
  fd.append('file', f);
  try {
    const r = await fetch('/ingest', { method: 'POST', body: fd, headers: HDRS });
    const j = await r.json();
    $('upstatus').textContent = r.ok
      ? `Indexed ${j.chunks_indexed} chunks from ${j.source}.`
      : `Error: ${j.detail || r.status}`;
  } catch (e) { $('upstatus').textContent = 'Error: ' + e; }
  $('ingest').disabled = false;
};

$('askform').onsubmit = async (ev) => {
  ev.preventDefault();
  const q = $('question').value.trim();
  if (!q) return;
  const empty = $('emptystate');
  if (empty) empty.remove();
  $('question').value = '';
  add('q', q);
  const wait = add('a busy', 'Thinking…');
  $('askbtn').disabled = true;
  try {
    const r = await fetch('/ask', {
      method: 'POST',
      headers: { ...HDRS, 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q }),
    });
    const j = await r.json();
    wait.classList.remove('busy');
    if (!r.ok) { wait.textContent = 'Error: ' + (j.detail || r.status); return; }
    wait.textContent = j.answer;
    if (j.sources && j.sources.length) {
      const d = document.createElement('details');
      d.className = 'srcs';
      d.innerHTML = '<summary>' + j.sources.length + ' source chunk(s)</summary>' +
        j.sources.map(s =>
          `<div class="src"><b>${esc(s.source)}</b><span class="score">${s.score}</span><br>${esc(s.chunk.slice(0, 300))}&hellip;</div>`
        ).join('');
      wait.appendChild(d);
    }
  } catch (e) { wait.classList.remove('busy'); wait.textContent = 'Error: ' + e; }
  $('askbtn').disabled = false;
};

function add(cls, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  $('chat').appendChild(div);
  div.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return div;
}
function esc(s) { const d = document.createElement('span'); d.textContent = s; return d.innerHTML; }
</script>
</body>
</html>
